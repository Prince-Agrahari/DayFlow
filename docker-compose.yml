services:
  postgres:
    image: postgres:15-alpine
    container_name: dayflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_hrm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dayflow} -d ${POSTGRES_DB:-dayflow_hrm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dayflow}:${POSTGRES_PASSWORD:-dayflow_secret}@postgres:5432/${POSTGRES_DB:-dayflow_hrm}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-min-32-chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DEBUG: ${DEBUG:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ai-engine:/ai-engine
      - ./analytics:/analytics
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: dayflow-frontend
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
